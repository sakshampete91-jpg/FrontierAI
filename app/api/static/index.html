<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHOKO</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap');

:root{
    --bg:#080809;
    --bg-soft:#0d0d10;
    --panel:#111114;
    --panel-hover:#17171b;
    --line:#25252b;
    --text:#f7f7f8;
    --muted:#85858e;
    --muted2:#5e5e67;

    /* Dynamic accent */
    --accent:#e879f9;
    --accent-dark:#a21caf;
    --accent-rgb:232,121,249;
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

/* =========================================================
   APP
   ========================================================= */

.app{
    width:100%;
    height:100vh;
    display:flex;
    background:
        radial-gradient(
            750px 520px at 72% -10%,
            rgba(var(--accent-rgb),.065),
            transparent 70%
        ),
        radial-gradient(
            500px 400px at 95% 90%,
            rgba(var(--accent-rgb),.025),
            transparent 75%
        ),
        var(--bg);

    transition:background .8s ease;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar{
    width:268px;
    flex-shrink:0;
    height:100%;
    padding:18px 14px;
    display:flex;
    flex-direction:column;
    background:rgba(12,12,14,.96);
    border-right:1px solid var(--line);
    z-index:30;
}

.brand{
    padding:2px 10px 22px;
}

.brand-name{
    font-family:Caveat,cursive;
    font-size:39px;
    line-height:1;
    font-weight:700;
    letter-spacing:.02em;
    color:#fafafa;

    text-shadow:
        0 0 28px rgba(var(--accent-rgb),.16);

    transition:
        color .6s ease,
        text-shadow .6s ease;
}

.brand-name span{
    color:var(--accent);
    transition:color .6s ease;
}

.brand-sub{
    margin-top:4px;
    font-size:9px;
    letter-spacing:.19em;
    color:#55555d;
    text-transform:uppercase;
}

.new-chat{
    height:44px;
    width:100%;
    border:1px solid #303036;
    border-radius:12px;
    background:#17171a;
    color:#eee;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 14px;
    font-size:13px;
    font-weight:600;
    transition:.2s ease;
}

.new-chat:hover{
    background:#1d1d21;
    border-color:rgba(var(--accent-rgb),.35);
    transform:translateY(-1px);
}

.plus{
    font-size:21px;
    font-weight:300;
    color:var(--accent);
    transition:color .6s ease;
}

.history-label{
    padding:25px 10px 9px;
    font-size:9px;
    font-weight:700;
    letter-spacing:.17em;
    color:#55555d;
    text-transform:uppercase;
}

.history{
    flex:1;
    overflow-y:auto;
}

.history::-webkit-scrollbar{
    width:4px;
}

.history::-webkit-scrollbar-thumb{
    background:#29292e;
    border-radius:20px;
}

.history-item{
    width:100%;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#a8a8b0;
    padding:10px 11px;
    margin-bottom:2px;
    text-align:left;
    font:500 12px Inter,sans-serif;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    cursor:pointer;
    transition:.15s;
}

.history-item:hover{
    background:#18181c;
    color:#eee;
}

.history-item.active{
    background:#202025;
    color:#fff;
}

.sidebar-bottom{
    padding-top:10px;
    border-top:1px solid var(--line);
}

.clear-btn{
    width:100%;
    padding:10px 11px;
    border:0;
    border-radius:9px;
    background:transparent;
    color:#6d6d75;
    text-align:left;
    font:500 12px Inter,sans-serif;
    cursor:pointer;
}

.clear-btn:hover{
    color:#f87171;
    background:rgba(239,68,68,.07);
}

/* =========================================================
   MAIN
   ========================================================= */

.main{
    flex:1;
    min-width:0;
    height:100%;
    display:flex;
    flex-direction:column;
    position:relative;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{
    height:60px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;

    border-bottom:1px solid rgba(255,255,255,.045);

    background:rgba(8,8,9,.72);
    backdrop-filter:blur(20px);

    z-index:10;
}

.mobile-menu{
    display:none;
    width:38px;
    height:38px;

    border:1px solid var(--line);
    border-radius:10px;

    background:#111114;
    color:#ddd;
    cursor:pointer;
}

.top-title{
    display:flex;
    align-items:center;
    gap:9px;
}

.top-title strong{
    font-size:13px;
    font-weight:600;
}

.local{
    padding:4px 8px;
    border:1px solid #29292f;
    border-radius:20px;
    color:#73737c;
    font-size:8px;
    letter-spacing:.09em;
}

.connection{
    color:#606069;
    font-size:10px;
}

/* =========================================================
   CHAT
   ========================================================= */

.chat-wrapper{
    flex:1;
    min-height:0;
    overflow-y:auto;
    scroll-behavior:smooth;
}

.chat-wrapper::-webkit-scrollbar{
    width:6px;
}

.chat-wrapper::-webkit-scrollbar-thumb{
    background:#25252a;
    border-radius:20px;
}

.chat{
    width:min(880px,100%);
    min-height:100%;
    margin:auto;
    padding:25px 28px 190px;
}

/* =========================================================
   WELCOME
   ========================================================= */

.welcome{
    min-height:calc(100vh - 270px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding-bottom:20px;
}

.welcome-brand{
    font-family:Caveat,cursive;
    font-size:78px;
    line-height:.85;
    font-weight:700;
    letter-spacing:.01em;

    margin-bottom:20px;

    color:#f7f7f8;

    text-shadow:
        0 0 45px rgba(var(--accent-rgb),.12);

    transition:text-shadow .7s ease;
}

.welcome-brand span{
    color:var(--accent);
    transition:color .6s ease;
}

.welcome h1{
    margin:0;
    font-size:26px;
    letter-spacing:-.035em;
    font-weight:600;
}

.welcome p{
    max-width:450px;
    margin:11px auto 0;

    color:#777780;
    font-size:12px;
    line-height:1.7;
}

/* =========================================================
   SUGGESTIONS
   ========================================================= */

.suggestions{
    width:min(650px,100%);
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin-top:28px;
}

.suggestion{
    border:1px solid #25252a;
    background:#101013;
    border-radius:12px;
    padding:14px;
    text-align:left;
    cursor:pointer;
    transition:.22s ease;
}

.suggestion:hover{
    background:#17171b;

    border-color:
        rgba(var(--accent-rgb),.32);

    transform:translateY(-2px);

    box-shadow:
        0 8px 30px
        rgba(var(--accent-rgb),.045);
}

.suggestion-title{
    font-size:11px;
    color:#e5e5e8;
    font-weight:600;
}

.suggestion-text{
    margin-top:4px;
    font-size:10px;
    color:#66666f;
}

/* =========================================================
   MESSAGES
   ========================================================= */

.message{
    display:flex;
    gap:13px;
    margin:30px 0;

    animation:
        messageIn .22s ease;
}

@keyframes messageIn{

    from{
        opacity:0;
        transform:translateY(5px);
    }

    to{
        opacity:1;
        transform:none;
    }

}

.avatar{
    width:29px;
    height:29px;
    flex:0 0 29px;

    margin-top:2px;

    border-radius:9px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:10px;
    font-weight:800;
}

.assistant .avatar{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent-dark)
        );

    box-shadow:
        0 5px 20px
        rgba(var(--accent-rgb),.14);

    transition:
        background .6s ease,
        box-shadow .6s ease;
}

.user{
    justify-content:flex-end;
}

.user .avatar{
    order:2;

    background:#29292e;
    color:#aaa;
}

.message-content{
    max-width:760px;
    min-width:0;
}

.user .message-content{
    max-width:min(620px,80%);
}

.message-text{
    color:#e6e6e9;
    font-size:13px;
    line-height:1.75;

    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.user .message-text{
    padding:11px 15px;

    background:#202025;

    border-radius:
        16px 16px 4px 16px;

    color:#f2f2f4;
}

.meta{
    margin-top:6px;

    color:#57575f;
    font-size:9px;
}

/* =========================================================
   THINKING
   ========================================================= */

.thinking{
    display:flex;
    align-items:center;
    gap:13px;
    margin:30px 0;
}

.thinking-text{
    color:#777780;
    font-size:12px;
}

.dots span{
    animation:blink 1.1s infinite;
}

.dots span:nth-child(2){
    animation-delay:.15s;
}

.dots span:nth-child(3){
    animation-delay:.3s;
}

@keyframes blink{

    0%,100%{
        opacity:.15;
    }

    50%{
        opacity:1;
    }

}

/* =========================================================
   SOURCES
   ========================================================= */

.sources{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(210px,1fr));

    gap:7px;
    margin-top:13px;
}

.source{
    display:block;

    padding:10px 11px;

    border:1px solid #29292f;
    border-radius:10px;

    background:#111114;

    text-decoration:none;

    transition:.18s;
}

.source:hover{
    background:#171219;

    border-color:
        rgba(var(--accent-rgb),.32);
}

.source-title{
    color:#c9c9cf;
    font-size:10px;
    font-weight:600;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.source-url{
    margin-top:4px;

    color:#5f5f68;
    font-size:9px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* =========================================================
   COMPOSER
   ========================================================= */

.composer-area{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    padding:16px 20px 19px;

    background:
        linear-gradient(
            to bottom,
            transparent,
            rgba(8,8,9,.94) 30%,
            #080809 65%
        );

    z-index:15;
}

.composer{
    width:min(820px,100%);
    margin:auto;

    border:1px solid #303036;

    border-radius:18px;

    background:
        rgba(17,17,20,.96);

    box-shadow:
        0 18px 55px rgba(0,0,0,.42),
        0 0 45px
        rgba(var(--accent-rgb),.035);

    transition:
        border-color .5s ease,
        box-shadow .5s ease;
}

.composer:focus-within{

    border-color:
        rgba(var(--accent-rgb),.40);

    box-shadow:
        0 18px 55px rgba(0,0,0,.48),
        0 0 50px
        rgba(var(--accent-rgb),.08);
}

.input-row{
    display:flex;
    align-items:flex-end;
    gap:7px;
    padding:9px;
}

textarea{
    flex:1;

    min-height:42px;
    max-height:170px;

    resize:none;

    border:0;
    outline:0;

    background:transparent;

    color:#f4f4f5;

    padding:9px 8px;

    font:
        13px/1.55
        Inter,sans-serif;
}

textarea::placeholder{
    color:#62626a;
}

.send{
    width:40px;
    height:40px;

    border:0;
    border-radius:12px;

    background:#f0f0f2;
    color:#09090b;

    font-size:18px;
    font-weight:800;

    cursor:pointer;

    transition:.18s;
}

.send:hover{
    background:#fff;
    transform:translateY(-1px);

    box-shadow:
        0 5px 20px
        rgba(var(--accent-rgb),.10);
}

.send:disabled{
    opacity:.3;
    cursor:not-allowed;
    transform:none;
    box-shadow:none;
}

.composer-footer{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:0 14px 9px;
}

.hint{
    color:#505058;
    font-size:8px;
}

.status{
    color:#62626a;
    font-size:9px;
}

.timer{
    color:#777780;
    font-size:9px;
    margin-left:6px;
}

/* =========================================================
   MOBILE
   ========================================================= */

.overlay{
    display:none;
}

@media(max-width:760px){

    .sidebar{
        position:fixed;

        top:0;
        bottom:0;
        left:-280px;

        transition:left .25s ease;

        box-shadow:
            20px 0 50px
            rgba(0,0,0,.5);
    }

    .sidebar.open{
        left:0;
    }

    .overlay.open{
        display:block;

        position:fixed;
        inset:0;

        background:
            rgba(0,0,0,.65);

        z-index:25;
    }

    .mobile-menu{
        display:block;
    }

    .topbar{
        padding:0 13px;
    }

    .connection{
        display:none;
    }

    .chat{
        padding:
            20px 14px 175px;
    }

    .welcome-brand{
        font-size:62px;
    }

    .welcome h1{
        font-size:23px;
    }

    .welcome p{
        padding:0 15px;
    }

    .suggestions{
        grid-template-columns:1fr;
        margin-top:23px;
    }

    .message{
        gap:9px;
        margin:25px 0;
    }

    .message-content{
        max-width:
            calc(100% - 40px);
    }

    .user .message-content{
        max-width:82%;
    }

    .message-text{
        font-size:12px;
    }

    .composer-area{
        padding:10px 9px 12px;
    }

    .hint{
        display:none;
    }

    .sources{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<div class="app">

    <!-- SIDEBAR -->

    <aside class="sidebar" id="sidebar">

        <div class="brand">

            <div class="brand-name">

            </div>

            <div class="brand-sub">

            </div>

        </div>

        <button
            class="new-chat"

        >

    <!-- MAIN -->

    <section class="main">

        <header class="topbar">

            <button
                class="mobile-menu"
                id="mobileMenu"
            >
                ☰
            </button>

            <div class="top-title">

                <strong
                    id="topChatName"
                >
                    New chat
                </strong>

                <span class="local">
                    LOCAL AI
                </span>

            </div>

            <div
                class="connection"
                id="connection"
            >
                ● Ready
            </div>

        </header>


        <!-- CHAT -->

        <div
            class="chat-wrapper"
            id="chatWrapper"
        >

            <main
                class="chat"
                id="chat"
            >

                <div
                    class="welcome"
                    id="welcome"
                >

                    <div class="welcome-brand">
                        CH<span>O</span>KO
                    </div>

                    <h1>

                    </h1>

                    <p>
                        Ask anything. Research something.
                        Build something. Let's get started.
                    </p>

                    <div class="suggestions">

                        <button
                            class="suggestion"
                            data-prompt="Explain quantum computing in simple words."
                        >

                            <div class="suggestion-title">
                                Explain something
                            </div>

                            <div class="suggestion-text">
                                Make a complex topic simple
                            </div>

                        </button>


                        <button
                            class="suggestion"
                            data-prompt="Help me write a clean Python program."
                        >

                            <div class="suggestion-title">
                                Build something
                            </div>

                            <div class="suggestion-text">
                                Turn an idea into code
                            </div>

                        </button>


                        <button
                            class="suggestion"
                            data-prompt="Research the latest developments in artificial intelligence."
                        >

                            <div class="suggestion-title">
                                Research
                            </div>

                            <div class="suggestion-text">
                                Find and explain useful information
                            </div>

                        </button>


                        <button
                            class="suggestion"
                            data-prompt="Give me three creative ideas for a project."
                        >

                            <div class="suggestion-title">
                                Brainstorm
                            </div>

                            <div class="suggestion-text">
                                Start with a blank page
                            </div>

        <!-- COMPOSER -->

        <div class="composer-area">

                <div class="input-row">

                        ↑

                        Enter to send · Shift + Enter for new line
                    </span>

                    <div>

                        <span
                            class="status"
                            id="status"
                        >
                            Ready
                        </span>

                        <span
                            class="timer"
                            id="timer"
                        ></span>

                    </div>

                </div>

            </div>

        </div>

    </section>

</div>


<script>

/* =========================================================
   CHOKO
   Dynamic user/session accent system
   ========================================================= */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("message");

const sendButton =
    document.getElementById("send");

const statusEl =
    document.getElementById("status");

const timerEl =
    document.getElementById("timer");

const historyEl =
    document.getElementById("history");

const newChatButton =
    document.getElementById("newChat");

const clearChatButton =
    document.getElementById("clearChat");

const topChatName =
    document.getElementById("topChatName");

const connection =
    document.getElementById("connection");

const sidebar =
    document.getElementById("sidebar");

const mobileMenu =
    document.getElementById("mobileMenu");

const overlay =
    document.getElementById("overlay");


/* =========================================================
   DYNAMIC COLORS
   ========================================================= */

const ACCENT_STORAGE =
    "choko_user_accent_v1";

const ACCENT_COLORS = [

    {
        main:"#e879f9",
        dark:"#a21caf",
        rgb:"232,121,249"
    },

    {
        main:"#a78bfa",
        dark:"#6d28d9",
        rgb:"167,139,250"
    },

    {
        main:"#60a5fa",
        dark:"#2563eb",
        rgb:"96,165,250"
    },

    {
        main:"#22d3ee",
        dark:"#0891b2",
        rgb:"34,211,238"
    },

    {
        main:"#34d399",
        dark:"#059669",
        rgb:"52,211,153"
    },

    {
        main:"#fb7185",
        dark:"#be123c",
        rgb:"251,113,133"
    },

    {
        main:"#f59e0b",
        dark:"#b45309",
        rgb:"245,158,11"
    },

    {
        main:"#f472b6",
        dark:"#be185d",
        rgb:"244,114,182"
    }

];


/*
   The color is stored per browser.

   First visit:
       choose a new color.

   Returning user:
       keep their existing color.

   New browser / cleared storage:
       gets another color.

   This prevents the color from changing randomly
   every time the page is refreshed.
*/

function setupUserAccent(){

    let saved = null;

    try{

        saved =
            localStorage.getItem(
                ACCENT_STORAGE
            );

    }catch(error){

        console.warn(
            "Accent storage unavailable."
        );

    }

    let index =
        Number(saved);

    if(
        !Number.isInteger(index) ||
        index < 0 ||
        index >= ACCENT_COLORS.length
    ){

        let previous =
            Number(
                sessionStorage.getItem(
                    "choko_last_accent"
                )
            );

        if(
            !Number.isInteger(previous) ||
            previous < 0
        ){

            previous = -1;

        }

        /*
           Pick a different accent from the
           previous one whenever possible.
        */

        const available =
            ACCENT_COLORS
                .map(
                    (_,i) => i
                )
                .filter(
                    i => i !== previous
                );

        index =
            available[
                Math.floor(
                    Math.random() *
                    available.length
                )
            ];

        try{

            localStorage.setItem(
                ACCENT_STORAGE,
                String(index)
            );

            sessionStorage.setItem(
                "choko_last_accent",
                String(index)
            );

        }catch(error){

            console.warn(
                "Could not save accent."
            );

        }

    }

    const accent =
        ACCENT_COLORS[index];

    document.documentElement.style.setProperty(
        "--accent",
        accent.main
    );

    document.documentElement.style.setProperty(
        "--accent-dark",
        accent.dark
    );

    document.documentElement.style.setProperty(
        "--accent-rgb",
        accent.rgb
    );

}

setupUserAccent();


/* =========================================================
   STORAGE
   ========================================================= */

const STORAGE_KEY =
    "choko_conversations_v2";

let conversations = [];

let currentConversationId =
    null;

let thinkingElement =
    null;

let timerStart =
    null;

let timerInterval =
    null;

let isSending =
    false;


/* =========================================================
   HELPERS
   ========================================================= */

function generateId(){

    return (
        "web-" +
        Math.random()
            .toString(36)
            .slice(2) +
        Date.now()
            .toString(36)
    );

}


function now(){

    return new Date().toISOString();

}


function formatTime(value){

    try{

        return new Date(value)
            .toLocaleTimeString(
                [],
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }catch{

        return "";

    }

}


function makeTitle(text){

    const clean =
        String(text)
            .replace(/\s+/g," ")
            .trim();

    if(!clean){

        return "New chat";

    }

    return clean.length > 34
        ? clean.slice(0,34) + "…"
        : clean;

}


/* =========================================================
   STORAGE FUNCTIONS
   ========================================================= */

function saveConversations(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(
                conversations
            )
        );

    }catch(error){

        console.error(
            "Could not save conversations:",
            error
        );

    }

}


function loadConversations(){

    try{

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(!raw){

            conversations = [];

            return;

        }

        const parsed =
            JSON.parse(raw);

        conversations =
            Array.isArray(parsed)
                ? parsed
                : [];

    }catch(error){

        console.error(
            "Could not load conversations:",
            error
        );

        conversations = [];

    }

}


function sortConversations(){

    conversations.sort(
        (a,b) =>
            new Date(
                b.updatedAt || 0
            ) -
            new Date(
                a.updatedAt || 0
            )
    );

}


function getCurrentConversation(){

    return conversations.find(
        conversation =>
            conversation.id ===
            currentConversationId
    );

}


/* =========================================================
   CONVERSATIONS
   ========================================================= */

function createConversation(){

    const conversation = {

        id:generateId(),

        title:"New chat",

        createdAt:now(),

        updatedAt:now(),

        messages:[]

    };

    conversations.unshift(
        conversation
    );

    currentConversationId =
        conversation.id;

    saveConversations();

    renderHistory();

    renderConversation();

    closeSidebar();

    return conversation;

}


function switchConversation(id){

    const conversation =
        conversations.find(
            item =>
                item.id === id
        );

    if(!conversation){

        return;

    }

    currentConversationId =
        id;

    renderHistory();

    renderConversation();

    closeSidebar();

}


/* =========================================================
   HISTORY
   ========================================================= */

function renderHistory(){

    historyEl.innerHTML = "";

    sortConversations();

    conversations.forEach(
        conversation => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "history-item";

            if(
                conversation.id ===
                currentConversationId
            ){

                button.classList.add(
                    "active"
                );

            }

            button.textContent =
                conversation.title ||
                "New chat";

            button.title =
                conversation.title ||
                "New chat";

            button.addEventListener(
                "click",
                () =>
                    switchConversation(
                        conversation.id
                    )
            );

            historyEl.appendChild(
                button
            );

        }
    );

}


/* =========================================================
   CHAT RENDER
   ========================================================= */

function renderConversation(){

    chat.innerHTML = "";

    const conversation =
        getCurrentConversation();

    if(
        !conversation ||
        !Array.isArray(
            conversation.messages
        ) ||
        conversation.messages.length === 0
    ){

        renderWelcome();

        topChatName.textContent =
            "New chat";

        return;

    }

    conversation.messages.forEach(
        message => {

            addMessageToDOM(
                message.role,
                message.text,
                message.meta || "",
                message.sources || [],
                false
            );

        }
    );

    topChatName.textContent =
        conversation.title ||
        "New chat";

    scrollToBottom(false);

}


/* =========================================================
   WELCOME
   ========================================================= */

        );

    welcome.className =
        "welcome";

    welcome.innerHTML = `

        <div class="welcome-brand">

        </div>

        <h1>
            What are we exploring today?
        </h1>

/* =========================================================
   MESSAGE UI
   ========================================================= */

function addMessageToDOM(
    role,
    text,
    meta="",
    sources=[],
    animate=true
){

    const wrapper =
        document.createElement(
            "div"
        );

    wrapper.className =
        "message " + role;

    if(!animate){

        wrapper.style.animation =
            "none";

    }

    const avatar =
        document.createElement(
            "div"
        );

    avatar.className =
        "avatar";

    avatar.textContent =
        role === "assistant"
            ? "C"
            : "You";

    const content =
        document.createElement(
            "div"
        );

    content.className =
        "message-content";

    const textElement =
        document.createElement(
            "div"
        );

    textElement.className =
        "message-text";

    /*
       textContent prevents
       HTML/script injection.
    */

    textElement.textContent =
        String(text ?? "");

    content.appendChild(
        textElement
    );

    if(meta){

        const metaElement =
            document.createElement(
                "div"
            );

        metaElement.className =
            "meta";

        metaElement.textContent =
            meta;

        content.appendChild(
            metaElement
        );

    }

    if(
        Array.isArray(sources) &&
        sources.length
    ){

        addSources(
            content,
            sources
        );

    }

    wrapper.appendChild(
        avatar
    );

    wrapper.appendChild(
        content
    );

    chat.appendChild(
        wrapper
    );

    return wrapper;

}


/* =========================================================
   SOURCES
   ========================================================= */

function addSources(
    container,
    sourceList
){

    const valid =
        sourceList.filter(
            source =>
                source &&
                (
                    source.url ||
                    source.title
                )
        );

    if(!valid.length){

        return;

    }

    const sources =
        document.createElement(
            "div"
        );

    sources.className =
        "sources";

    valid.forEach(
        source => {

            const card =
                document.createElement(
                    "a"
                );

            card.className =
                "source";

            if(source.url){

                card.href =
                    source.url;

                card.target =
                    "_blank";

                card.rel =
                    "noopener noreferrer";

            }

            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "source-title";

            title.textContent =
                source.title ||
                source.url ||
                "Source";

            const url =
                document.createElement(
                    "div"
                );

            url.className =
                "source-url";

            url.textContent =
                source.url || "";

            card.appendChild(
                title
            );

            card.appendChild(
                url
            );

            sources.appendChild(
                card
            );

        }
    );

    container.appendChild(
        sources
    );

}


/* =========================================================
   THINKING
   ========================================================= */

function addThinking(){

    removeThinking();

    thinkingElement =
        document.createElement(
            "div"
        );

    thinkingElement.className =
        "thinking";

    thinkingElement.innerHTML = `

        <div class="avatar">
            C
        </div>

        <div class="thinking-text">

            CHOKO is thinking

            <span class="dots">
                <span>.</span>
                <span>.</span>
                <span>.</span>
            </span>

        </div>
    `;

    chat.appendChild(
        thinkingElement
    );

    scrollToBottom();

}


function removeThinking(){

    if(thinkingElement){

        thinkingElement.remove();

        thinkingElement = null;

    }

}


/* =========================================================
   TIMER
   ========================================================= */

function startTimer(){

    timerStart =
        performance.now();

    clearInterval(
        timerInterval
    );

    timerEl.textContent =
        "0.0s";

    timerInterval =
        setInterval(
            () => {

                const seconds =
                    (
                        performance.now() -
                        timerStart
                    ) / 1000;

                timerEl.textContent =
                    seconds.toFixed(1) +
                    "s";

            },
            100
        );

}


function stopTimer(){

    clearInterval(
        timerInterval
    );

    timerInterval = null;

    if(timerStart){

        const seconds =
            (
                performance.now() -
                timerStart
            ) / 1000;

        timerEl.textContent =
            seconds.toFixed(1) +
            "s";

    }

    timerStart = null;

}


/* =========================================================
   SCROLL
   ========================================================= */

function scrollToBottom(
    smooth=true
){

    const wrapper =
        document.getElementById(
            "chatWrapper"
        );

    requestAnimationFrame(
        () => {

            wrapper.scrollTo({

                top:
                    wrapper.scrollHeight,

                behavior:
                    smooth
                        ? "smooth"
                        : "auto"

            });

        }
    );

}


/* =========================================================
   SEND
   ========================================================= */

async function sendMessage(){

    if(isSending){

        return;

    }

    const message =
        input.value.trim();

    if(!message){

        return;

    }

    isSending = true;

    sendButton.disabled =
        true;

    input.disabled =
        true;

    statusEl.textContent =
        "Thinking…";

    connection.textContent =
        "● Processing";

    let conversation =
        getCurrentConversation();

    if(!conversation){

        conversation =
            createConversation();

    }

    const userMessage = {

        role:"user",

        text:message,

        meta:formatTime(now())

    };

    conversation.messages.push(
        userMessage
    );

    conversation.updatedAt =
        now();

    if(
        conversation.title ===
        "New chat"
    ){

        conversation.title =
            makeTitle(message);

    }

    saveConversations();

    renderHistory();

    const welcomeElement =
        document.querySelector(
            ".welcome"
        );

    if(welcomeElement){

        welcomeElement.remove();

    }

    addMessageToDOM(
        "user",
        userMessage.text,
        userMessage.meta
    );

    input.value = "";

    autoResize();

    addThinking();

    startTimer();

    scrollToBottom();

    try{

        const response =
            await fetch(
                "/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:message,

                        conversation_id:
                            conversation.id

                    })

                }
            );

        let data;

        try{

            data =
                await response.json();

        }catch{

            data = null;

        }

        if(!response.ok){

            throw new Error(
                data &&
                data.detail
                    ? data.detail
                    : "Request failed."
            );

        }

        removeThinking();

        stopTimer();

        const assistantText =
            data &&
            data.response
                ? data.response
                : "I didn't receive a response.";

        const metaParts = [];

        if(
            data &&
            data.intent
        ){

            metaParts.push(
                data.intent
            );

        }

        if(
            data &&
            data.status
        ){

            metaParts.push(
                data.status
            );

        }

        const sources =
            data &&
            data.research &&
            Array.isArray(
                data.research.sources
            )
                ? data.research.sources
                : [];

        const assistantMessage = {

            role:"assistant",

            text:assistantText,

            meta:
                metaParts.join(
                    " · "
                ),

            sources:sources

        };

        conversation.messages.push(
            assistantMessage
        );

        conversation.updatedAt =
            now();

        saveConversations();

        renderHistory();

        addMessageToDOM(
            "assistant",
            assistantMessage.text,
            assistantMessage.meta,
            assistantMessage.sources
        );

        topChatName.textContent =
            conversation.title;

        statusEl.textContent =
            "Ready";

        connection.textContent =
            "● Ready";

        scrollToBottom();

    }catch(error){

        console.error(
            "CHOKO request error:",
            error
        );

        removeThinking();

        stopTimer();

        const errorText =
            "Something went wrong: " +
            (
                error.message ||
                "Unable to reach CHOKO."
            );

        const errorMessage = {

            role:"assistant",

            text:errorText,

            meta:"Error",

            sources:[]

        };

        conversation.messages.push(
            errorMessage
        );

        conversation.updatedAt =
            now();

        saveConversations();

        addMessageToDOM(
            "assistant",
            errorText,
            "Error"
        );

        statusEl.textContent =
            "Error";

        connection.textContent =
            "● Connection error";

        scrollToBottom();

    }finally{

        isSending = false;

        sendButton.disabled =
            false;

        input.disabled =
            false;

        input.focus();

    }

}


/* =========================================================
   NEW CHAT
   ========================================================= */

function startNewChat(){

    if(isSending){

        return;

    }

    createConversation();

    input.value = "";

    autoResize();

    statusEl.textContent =
        "Ready";

    connection.textContent =
        "● Ready";

    input.focus();

}


/* =========================================================
   CLEAR
   ========================================================= */

function clearCurrentChat(){

    if(isSending){

        return;

    }

    const conversation =
        getCurrentConversation();

    if(!conversation){

        return;

    }

    const confirmed =
        window.confirm(
            "Clear this chat and start fresh?"
        );

    if(!confirmed){

        return;

    }

    const index =
        conversations.findIndex(
            item =>
                item.id ===
                conversation.id
        );

    if(index !== -1){

        conversations.splice(
            index,
            1
        );

    }

    saveConversations();

    createConversation();

    input.focus();

}


/* =========================================================
   TEXTAREA
   ========================================================= */

function autoResize(){

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            170
        ) + "px";

}


/* =========================================================
   MOBILE SIDEBAR
   ========================================================= */

function openSidebar(){

    sidebar.classList.add(
        "open"
    );

    overlay.classList.add(
        "open"
    );

}


function closeSidebar(){

    sidebar.classList.remove(
        "open"
    );

    overlay.classList.remove(
        "open"
    );

}


/* =========================================================
   EVENTS
   ========================================================= */

sendButton.addEventListener(
    "click",
    sendMessage
);

newChatButton.addEventListener(
    "click",
    startNewChat
);

clearChatButton.addEventListener(
    "click",
    clearCurrentChat
);

mobileMenu.addEventListener(
    "click",
    openSidebar
);

overlay.addEventListener(
    "click",
    closeSidebar
);

input.addEventListener(
    "input",
    autoResize
);

input.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================================
   INITIALIZE
   ========================================================= */

loadConversations();

if(conversations.length === 0){

    createConversation();

}else{

    sortConversations();

    currentConversationId =
        conversations[0].id;

    renderHistory();

    renderConversation();

}

input.focus();

autoResize();

</script>
